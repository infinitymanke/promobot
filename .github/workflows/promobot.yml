name: promobot

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
        run: python runner.py

      - name: Commit state (dedup history, trusted pool)
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "promobot"
            git config user.email "promobot@users.noreply.github.com"
            git add state.json
            git commit -m "promobot: state update"
            git push
          else
            echo "state не изменился — пуш не нужен"
          fi