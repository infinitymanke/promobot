name: promobot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore state (dedup history)
        uses: actions/cache@v4
        with:
          path: state.json
          key: promobot-state-v1

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
        run: python runner.py

      - name: Save state (dedup history)
        uses: actions/cache@v4
        with:
          path: state.json
          key: promobot-state-v1